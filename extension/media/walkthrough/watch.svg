<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360">
  <style>
    .panel { fill: var(--vscode-sideBar-background, #252526); stroke: var(--vscode-widget-border, #3c3c3c); }
    .activity { fill: var(--vscode-activityBar-background, #333333); }
    .fg { fill: var(--vscode-foreground, #cccccc); }
    .dim { fill: var(--vscode-descriptionForeground, #9d9d9d); }
    .dimline { stroke: var(--vscode-descriptionForeground, #9d9d9d); }
    .fgline { stroke: var(--vscode-foreground, #cccccc); }
    .faint { fill: var(--vscode-descriptionForeground, #9d9d9d); opacity: .28; }
    .accent { fill: var(--vscode-charts-orange, #ef8a4b); }
    .hover { fill: var(--vscode-list-hoverBackground, #2a2d2e); }
    .focus { stroke: var(--vscode-focusBorder, #007fd4); }
    .badge { fill: var(--vscode-activityBarBadge-background, #007acc); }
    .badgefg { fill: var(--vscode-activityBarBadge-foreground, #ffffff); }
    text { font-family: var(--vscode-font-family, 'Segoe UI', system-ui, sans-serif); }
  </style>
  <defs>
    <path id="logo" d="M12 5.11C9.92 7.75 6.72 11.53 2 16.25C3.13 17 3.89 17.75 5.02 18.89C7.66 16.25 9.74 14.17 12 12.28C14.26 14.17 16.34 16.25 18.98 18.89C20.11 17.75 20.87 17 22 16.25C17.28 11.53 14.08 7.75 12 5.11Z"/>
    <symbol id="eye" viewBox="0 0 16 16"><path d="M1.5 8C3.4 4.6 5.6 3.5 8 3.5s4.6 1.1 6.5 4.5c-1.9 3.4-4.1 4.5-6.5 4.5S3.4 11.4 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="2" fill="currentColor"/></symbol>
    <symbol id="eyeClosed" viewBox="0 0 16 16"><path d="M1.5 6.5C3.4 9.6 5.6 10.5 8 10.5s4.6-.9 6.5-4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M4 9.6l-1.3 1.8M8 10.5v2.2M12 9.6l1.3 1.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></symbol>
    <symbol id="upload" viewBox="0 0 16 16"><path d="M8 11V3.5M4.8 6.6L8 3.4l3.2 3.2M3 13h10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>

  <!-- barra de actividad, con el número de repos con cambios -->
  <rect x="96" y="40" width="44" height="280" rx="10" class="activity"/>
  <rect x="110" y="60" width="16" height="16" rx="3" style="fill: var(--vscode-activityBar-inactiveForeground, #858585); opacity: .5"/>
  <rect x="110" y="92" width="16" height="16" rx="3" style="fill: var(--vscode-activityBar-inactiveForeground, #858585); opacity: .5"/>
  <rect x="96" y="120" width="2.5" height="32" class="accent"/>
  <use href="#logo" transform="translate(106 124) scale(1)" style="fill: var(--vscode-activityBar-foreground, #ffffff)"/>
  <circle cx="129" cy="146" r="8" class="badge"/>
  <text x="129" y="150" text-anchor="middle" font-size="10" font-weight="600" class="badgefg">2</text>

  <!-- la vista -->
  <rect x="148" y="40" width="316" height="280" rx="10" class="panel"/>
  <text x="166" y="68" font-size="11" letter-spacing="1" class="dim">APUS</text>
  <rect x="408" y="58" width="12" height="12" rx="2" class="faint"/>
  <rect x="430" y="58" width="12" height="12" rx="2" class="faint"/>
  <path d="M166 92l4 4 4-4" fill="none" stroke-width="1.3" stroke-linecap="round" class="dimline"/>
  <text x="182" y="97" font-size="11" font-weight="600" letter-spacing=".6" class="fg">REPOS</text>

  <!-- web: vigilando, cuenta regresiva -->
  <use href="#logo" transform="translate(172 113) scale(.68)" class="accent"/>
  <text x="196" y="128" font-size="13" class="fg">web</text>
  <text x="230" y="128" font-size="12" class="dim">3 · 1:40</text>

  <!-- api: vigilando, al día -->
  <use href="#logo" transform="translate(172 147) scale(.68)" class="accent"/>
  <text x="196" y="162" font-size="13" class="fg">api</text>
  <text x="226" y="162" font-size="12" class="dim">10:48</text>

  <!-- notes: en pausa, con el mouse encima -->
  <rect x="149" y="176" width="314" height="30" class="hover"/>
  <use href="#eyeClosed" x="172" y="183" width="16" height="16" style="color: var(--vscode-descriptionForeground, #9d9d9d)"/>
  <text x="196" y="196" font-size="13" class="fg">notes</text>
  <text x="240" y="196" font-size="12" class="dim">2</text>
  <use href="#eye" x="404" y="183" width="16" height="16" style="color: var(--vscode-foreground, #cccccc)"/>
  <use href="#upload" x="432" y="183" width="16" height="16" style="color: var(--vscode-foreground, #cccccc)"/>
  <circle cx="412" cy="191" r="13" fill="none" stroke-width="2" class="focus"/>

  <!-- puntero -->
  <path d="M418 199l0 22 5.6-5.2 3.8 8.4 3.6-1.6-3.8-8.2 7.6-.4z" fill="#ffffff" stroke="#1b1a1f" stroke-width="1.3" stroke-linejoin="round"/>

  <rect x="172" y="234" width="120" height="6" rx="3" class="faint"/>
  <rect x="172" y="252" width="176" height="6" rx="3" class="faint"/>
  <rect x="172" y="270" width="92" height="6" rx="3" class="faint"/>
</svg>
