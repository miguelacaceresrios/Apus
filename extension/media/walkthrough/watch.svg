<svg font-family="var(--vscode-font-family, 'Segoe UI', system-ui, sans-serif)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360">
  <!-- Los colores van como atributos: VS Code muestra este SVG sin permitir <style> ni class. -->
  <defs>
    <path id="logo" d="M12 5.11C9.92 7.75 6.72 11.53 2 16.25C3.13 17 3.89 17.75 5.02 18.89C7.66 16.25 9.74 14.17 12 12.28C14.26 14.17 16.34 16.25 18.98 18.89C20.11 17.75 20.87 17 22 16.25C17.28 11.53 14.08 7.75 12 5.11Z"/>
    <path id="chevron" d="M0 0l4 4 4-4" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="folder" d="M1.5 3.5h4l1.5 1.5h7.5v8h-13z" fill="none" stroke-width="1.2" stroke-linejoin="round"/>
    <g id="link" fill="none" stroke-width="1.2" stroke-linecap="round">
      <path d="M6.5 9.5l3-3"/>
      <path d="M7.5 4.5l1-1a2.5 2.5 0 0 1 3.5 3.5l-1 1"/>
      <path d="M8.5 11.5l-1 1a2.5 2.5 0 0 1-3.5-3.5l1-1"/>
    </g>
    <g id="branch" fill="none" stroke-width="1.2" stroke-linecap="round">
      <circle cx="4.5" cy="3.5" r="1.6"/>
      <circle cx="4.5" cy="12.5" r="1.6"/>
      <circle cx="11.5" cy="5.5" r="1.6"/>
      <path d="M4.5 5.1v5.8M11.5 7.1c0 2.4-2 3.2-7 3.8"/>
    </g>
    <path id="shield" d="M8 1.5l5.5 2v4c0 3.4-2.3 6-5.5 7-3.2-1-5.5-3.6-5.5-7v-4z" fill="none" stroke-width="1.3" stroke-linejoin="round"/>
  </defs>

  <!-- barra de actividad, con el número de repos con cambios -->
  <rect x="84" y="40" width="44" height="280" rx="10" fill="var(--vscode-activityBar-background, #333333)"/>
  <rect x="98" y="60" width="16" height="16" rx="3" fill="var(--vscode-activityBar-inactiveForeground, #858585)" opacity=".5"/>
  <rect x="98" y="92" width="16" height="16" rx="3" fill="var(--vscode-activityBar-inactiveForeground, #858585)" opacity=".5"/>
  <rect x="84" y="120" width="2.5" height="32" fill="var(--vscode-charts-orange, #ef8a4b)"/>
  <use href="#logo" transform="translate(94 124)" fill="var(--vscode-activityBar-foreground, #ffffff)"/>
  <circle cx="117" cy="146" r="8" fill="var(--vscode-activityBarBadge-background, #007acc)"/>
  <text x="117" y="150" text-anchor="middle" font-size="10" font-weight="600" fill="var(--vscode-activityBarBadge-foreground, #ffffff)">2</text>

  <!-- la vista -->
  <rect x="136" y="40" width="340" height="280" rx="10" fill="var(--vscode-sideBar-background, #252526)" stroke="var(--vscode-widget-border, #3c3c3c)"/>
  <text x="154" y="66" font-size="11" letter-spacing="1" fill="var(--vscode-descriptionForeground, #9d9d9d)">APUS</text>
  <path d="M424 55v12M418 61h12" stroke-width="1.4" stroke-linecap="round" stroke="var(--vscode-foreground, #cccccc)"/>
  <rect x="442" y="55" width="12" height="12" rx="2" fill="var(--vscode-descriptionForeground, #9d9d9d)" opacity=".28"/>

  <!-- web: vigilando, con la ficha abierta -->
  <use href="#chevron" transform="translate(152 86)" stroke="var(--vscode-descriptionForeground, #9d9d9d)"/>
  <use href="#logo" transform="translate(166 78) scale(.68)" fill="var(--vscode-charts-orange, #ef8a4b)"/>
  <text x="190" y="93" font-size="13" fill="var(--vscode-foreground, #cccccc)">web</text>
  <text x="222" y="93" font-size="12" fill="var(--vscode-descriptionForeground, #9d9d9d)">3 · 1:40</text>

  <use href="#folder" transform="translate(184 104)" stroke="var(--vscode-foreground, #cccccc)"/>
  <rect x="208" y="109" width="44" height="7" rx="3.5" fill="var(--vscode-foreground, #cccccc)" opacity=".7"/>
  <text x="262" y="117" font-size="12" fill="var(--vscode-descriptionForeground, #9d9d9d)">~/code/web</text>

  <!-- la URL, con el mouse encima: un clic la cambia -->
  <rect x="137" y="128" width="338" height="26" fill="var(--vscode-list-hoverBackground, #2a2d2e)"/>
  <use href="#link" transform="translate(184 133)" stroke="var(--vscode-foreground, #cccccc)"/>
  <rect x="208" y="137" width="28" height="7" rx="3.5" fill="var(--vscode-foreground, #cccccc)" opacity=".7"/>
  <text x="246" y="145" font-size="12" fill="var(--vscode-descriptionForeground, #9d9d9d)">github.com/you/web</text>
  <path d="M398 157l0 20 5-4.6 3.4 7.6 3.2-1.4-3.4-7.4 6.8-.4z" fill="#ffffff" stroke="#1b1a1f" stroke-width="1.2" stroke-linejoin="round"/>

  <use href="#branch" transform="translate(184 161)" stroke="var(--vscode-foreground, #cccccc)"/>
  <rect x="208" y="165" width="40" height="7" rx="3.5" fill="var(--vscode-foreground, #cccccc)" opacity=".7"/>
  <text x="258" y="173" font-size="12" fill="var(--vscode-descriptionForeground, #9d9d9d)">main → origin/main</text>

  <!-- api: frenado por un .env -->
  <use href="#chevron" transform="translate(152 198)" stroke="var(--vscode-descriptionForeground, #9d9d9d)"/>
  <use href="#shield" transform="translate(167 190)" stroke="var(--vscode-problemsWarningIcon-foreground, #cca700)"/>
  <text x="190" y="205" font-size="13" fill="var(--vscode-foreground, #cccccc)">api</text>
  <rect x="218" y="198" width="70" height="7" rx="3.5" fill="var(--vscode-descriptionForeground, #9d9d9d)" opacity=".5"/>

  <use href="#shield" transform="translate(184 217)" stroke="var(--vscode-problemsWarningIcon-foreground, #cca700)"/>
  <rect x="208" y="222" width="50" height="7" rx="3.5" fill="var(--vscode-foreground, #cccccc)" opacity=".7"/>
  <text x="268" y="230" font-size="12" font-family="var(--vscode-editor-font-family, Consolas, 'Courier New', monospace)" fill="var(--vscode-descriptionForeground, #9d9d9d)">.env</text>

  <!-- notes: en pausa -->
  <use href="#chevron" transform="translate(152 254) rotate(-90 4 2)" stroke="var(--vscode-descriptionForeground, #9d9d9d)"/>
  <path d="M167 256C169 259 171.5 260 175 260s6-1 8-4" fill="none" stroke-width="1.2" stroke-linecap="round" stroke="var(--vscode-descriptionForeground, #9d9d9d)"/>
  <path d="M169.5 259l-1.3 1.8M175 260v2.2M180.5 259l1.3 1.8" stroke-width="1.2" stroke-linecap="round" stroke="var(--vscode-descriptionForeground, #9d9d9d)"/>
  <text x="190" y="262" font-size="13" fill="var(--vscode-foreground, #cccccc)">notes</text>
  <text x="234" y="262" font-size="12" fill="var(--vscode-descriptionForeground, #9d9d9d)">2</text>

  <rect x="166" y="286" width="120" height="6" rx="3" fill="var(--vscode-descriptionForeground, #9d9d9d)" opacity=".28"/>
</svg>
