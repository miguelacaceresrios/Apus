<svg font-family="var(--vscode-font-family, 'Segoe UI', system-ui, sans-serif)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360">
  <!-- Los colores van como atributos: VS Code muestra este SVG sin permitir <style> ni class. -->
  <defs>
    <path id="logo" d="M12 5.11C9.92 7.75 6.72 11.53 2 16.25C3.13 17 3.89 17.75 5.02 18.89C7.66 16.25 9.74 14.17 12 12.28C14.26 14.17 16.34 16.25 18.98 18.89C20.11 17.75 20.87 17 22 16.25C17.28 11.53 14.08 7.75 12 5.11Z"/>
    <path id="shield" d="M8 1.5l5.5 2v4c0 3.4-2.3 6-5.5 7-3.2-1-5.5-3.6-5.5-7v-4z" fill="none" stroke-width="1.3" stroke-linejoin="round"/>
    <g id="key" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="5" cy="8" r="3"/>
      <path d="M8 8h6.5M12 8v2.5M14.5 8v2"/>
    </g>
    <g id="exclude" fill="none" stroke-width="1.3" stroke-linecap="round">
      <circle cx="8" cy="8" r="5.5"/>
      <path d="M4.2 11.8l7.6-7.6"/>
    </g>
    <g id="pass" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="5.5"/>
      <path d="M5.5 8.2l1.8 1.8 3.3-3.6"/>
    </g>
  </defs>

  <!-- el escudo grande: nada sale sin revisar -->
  <path d="M110 58l62 22v46c0 38-26 68-62 80-36-12-62-42-62-80v-46z" fill="var(--vscode-editorWidget-background, #252526)" stroke="var(--vscode-problemsWarningIcon-foreground, #cca700)" stroke-width="3" stroke-linejoin="round"/>
  <use href="#logo" transform="translate(74 90) scale(3)" fill="var(--vscode-charts-orange, #ef8a4b)"/>
  <rect x="62" y="236" width="96" height="30" rx="6" fill="var(--vscode-editorWidget-background, #252526)" stroke="var(--vscode-widget-border, #3c3c3c)"/>
  <text x="110" y="256" text-anchor="middle" font-size="13" font-family="var(--vscode-editor-font-family, Consolas, 'Courier New', monospace)" fill="var(--vscode-foreground, #cccccc)">git push</text>
  <path d="M104 272l6 8 6-8" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="var(--vscode-descriptionForeground, #9d9d9d)"/>
  <path d="M96 292h28" stroke-width="3" stroke-linecap="round" stroke="var(--vscode-problemsWarningIcon-foreground, #cca700)"/>

  <!-- la revisión: cada aviso con su arreglo -->
  <rect x="210" y="70" width="300" height="220" rx="10" fill="var(--vscode-editorWidget-background, #252526)" stroke="var(--vscode-widget-border, #3c3c3c)"/>
  <use href="#shield" transform="translate(226 84)" stroke="var(--vscode-problemsWarningIcon-foreground, #cca700)"/>
  <rect x="250" y="89" width="120" height="7" rx="3.5" fill="var(--vscode-foreground, #cccccc)" opacity=".7"/>
  <rect x="222" y="112" width="276" height="26" rx="4" fill="var(--vscode-input-background, #3c3c3c)" stroke="var(--vscode-focusBorder, #007fd4)"/>

  <!-- .env: con el mouse encima, los botones a la vista -->
  <rect x="211" y="150" width="298" height="48" fill="var(--vscode-list-hoverBackground, #2a2d2e)"/>
  <use href="#key" transform="translate(226 158)" stroke="var(--vscode-foreground, #cccccc)"/>
  <text x="250" y="170" font-size="13" font-family="var(--vscode-editor-font-family, Consolas, 'Courier New', monospace)" fill="var(--vscode-foreground, #cccccc)">.env</text>
  <rect x="290" y="163" width="110" height="7" rx="3.5" fill="var(--vscode-descriptionForeground, #9d9d9d)" opacity=".5"/>
  <rect x="250" y="181" width="150" height="6" rx="3" fill="var(--vscode-descriptionForeground, #9d9d9d)" opacity=".28"/>
  <circle cx="452" cy="167" r="12" fill="var(--vscode-toolbar-hoverBackground, #5a5d5e)" opacity=".6"/>
  <use href="#exclude" transform="translate(444 159)" stroke="var(--vscode-foreground, #cccccc)"/>
  <use href="#pass" transform="translate(472 159)" stroke="var(--vscode-foreground, #cccccc)"/>
  <path d="M456 174l0 20 5-4.6 3.4 7.6 3.2-1.4-3.4-7.4 6.8-.4z" fill="#ffffff" stroke="#1b1a1f" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- config.ts:12 -->
  <use href="#key" transform="translate(226 212)" stroke="var(--vscode-foreground, #cccccc)"/>
  <text x="250" y="224" font-size="13" font-family="var(--vscode-editor-font-family, Consolas, 'Courier New', monospace)" fill="var(--vscode-foreground, #cccccc)">config.ts:12</text>
  <rect x="352" y="217" width="80" height="7" rx="3.5" fill="var(--vscode-descriptionForeground, #9d9d9d)" opacity=".5"/>
  <rect x="250" y="235" width="170" height="6" rx="3" fill="var(--vscode-descriptionForeground, #9d9d9d)" opacity=".28"/>

  <!-- data.zip: demasiado grande -->
  <rect x="228" y="258" width="12" height="15" rx="2" fill="none" stroke-width="1.3" stroke="var(--vscode-foreground, #cccccc)"/>
  <path d="M232 262h4M232 266h4" stroke-width="1.2" stroke-linecap="round" stroke="var(--vscode-foreground, #cccccc)"/>
  <text x="250" y="270" font-size="13" font-family="var(--vscode-editor-font-family, Consolas, 'Courier New', monospace)" fill="var(--vscode-foreground, #cccccc)">data.zip</text>
  <text x="322" y="270" font-size="12" fill="var(--vscode-descriptionForeground, #9d9d9d)">180 MB</text>
</svg>
