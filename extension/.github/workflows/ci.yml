name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: textos extraídos al día
        shell: bash
        run: npm run l10n && git diff --exit-code l10n/bundle.l10n.json
      - name: pruebas
        run: npm test
      - name: empaquetar
        run: npm run vsix
