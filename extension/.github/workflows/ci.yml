name: ci

on:
  push:
  pull_request:

# Las pruebas solo leen el repo: el token de Actions no necesita más.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: tipos
        run: npm run check

      - name: lint
        run: npm run lint

      - name: formato
        run: npm run format:check

      - name: textos extraídos al día
        shell: bash
        run: npm run l10n && git diff --exit-code l10n/bundle.l10n.json

      - name: pruebas y cobertura
        shell: bash
        run: |
          npm run test:coverage | tee coverage.txt
          if [ "$RUNNER_OS" = Linux ]; then
            { echo '### Cobertura del núcleo'; echo '```'; grep -E '^(File|All files| [a-z])' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: empaquetar
        run: npm run vsix

  # Dentro de un VS Code de verdad, con la extensión Git y el apus de la última release.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: apus, desde su última release
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/apus"
          exe="$RUNNER_TEMP/apus/apus"
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Windows-X64) asset=apus.exe; exe="$exe.exe" ;;
            Linux-X64) asset=apus-linux-amd64 ;;
            macOS-ARM64) asset=apus-darwin-arm64 ;;
            macOS-X64) asset=apus-darwin-amd64 ;;
            *) echo "no hay binario de apus para $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL -o "$exe" "https://github.com/miguelacaceresrios/Apus/releases/latest/download/$asset"
          chmod +x "$exe"
          "$exe" --version
          echo "APUS_EXE=$exe" >> "$GITHUB_ENV"

      - name: VS Code en caché
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: compilar
        run: npm run compile

      - name: pruebas de integración (Linux, sin pantalla)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: pruebas de integración (Windows y macOS)
        if: runner.os != 'Linux'
        run: npm run test:integration
