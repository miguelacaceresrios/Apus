# apus no tiene dependencias de Go: de su lado solo se actualizan las acciones,
# que están fijadas por commit. Dependabot mueve el hash y el comentario con la
# versión juntos. La extensión (extension/) tiene sus dependencias de npm.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    groups:
      # Lo menor de desarrollo, en un solo pull request por semana. Las
      # versiones mayores llegan cada una por su lado, para probarlas solas.
      dev:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # @types/vscode sigue a engines.vscode: se sube a mano, junto con él.
      - dependency-name: '@types/vscode'
      # @types/node sigue a la versión de Node del CI y de VS Code.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript no sigue semver, y typescript-eslint tarda en soportar cada
      # versión nueva: se sube a mano, cuando lo soporte.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
