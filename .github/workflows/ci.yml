name: ci

on:
  push:
  pull_request:

# Las pruebas solo leen el repo: el token de Actions no necesita más.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: formato
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: pruebas de Go
        run: go test ./...

      - name: compilar
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          go build -trimpath -o "dist/apus$ext" .

      - name: terminal (apus.sh)
        run: scripts/test.sh

      - name: terminal (binario)
        run: APUS_IMPL=go scripts/test.sh
